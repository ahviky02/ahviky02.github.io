<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Outer Shadow -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Stylized Geometric "AY" Tech Monogram -->
  <g filter="url(#glow)">
    <!-- "A" Outer Frame & Peak -->
    <path d="M64 22 L36 90 L48 90 L56 70 L72 70 L80 90 L92 90 Z" fill="none" stroke="url(#neonGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- "A" Crossbar connecting with "Y" Stem -->
    <line x1="53" y1="64" x2="75" y2="64" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- "Y" Stylized Dynamic Center V & Descender -->
    <path d="M52 46 L64 62 L76 46" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="64" y1="62" x2="64" y2="94" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Glowing Live Tech Accent Dot -->
  <circle cx="94" cy="30" r="5" fill="#10b981" />
  <circle cx="94" cy="30" r="8" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
</svg>
